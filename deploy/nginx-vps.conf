# Конфиг nginx для VPS (входная точка).
# Положить на VPS: /etc/nginx/sites-available/china-reviews
# Затем:  ln -s /etc/nginx/sites-available/china-reviews /etc/nginx/sites-enabled/
#         nginx -t && systemctl reload nginx
#
# Замените your-domain.ru на ваш реальный домен ДО получения сертификата.
# Блок с HTTPS добавит certbot автоматически (см. инструкцию), но базовый
# вариант приведён ниже на случай ручной настройки.

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.ru www.your-domain.ru;

    # Порт 8001 на VPS — это конец SSH reverse-туннеля от домашнего сервера.
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты на случай "просыпания" туннеля.
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }
}

# ----------------------------------------------------------------------
# После запуска `certbot --nginx` этот файл будет автоматически дополнен
# блоком `listen 443 ssl` с путями к сертификатам Let's Encrypt и
# редиректом с http на https. Вручную добавлять ничего не нужно.
# ----------------------------------------------------------------------
