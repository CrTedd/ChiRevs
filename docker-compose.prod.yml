# Production-конфигурация для ДОМАШНЕГО СЕРВЕРА.
# Отличия от обычного docker-compose.yml:
#  - backend слушает только 127.0.0.1 (наружу его выставляет SSH-туннель, не Docker);
#  - PostgreSQL не публикует порт наружу вообще (доступен только внутри Docker-сети);
#  - секреты берутся из файла .env рядом с этим compose (а не хардкодом).
#
# Запуск на домашнем сервере:
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Порт наружу НЕ публикуем — БД доступна только контейнеру backend.

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      AUTO_SEED: ${AUTO_SEED:-true}
    # Слушаем только локальный интерфейс домашнего сервера.
    # Публичный доступ обеспечивает SSH reverse tunnel -> VPS.
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
